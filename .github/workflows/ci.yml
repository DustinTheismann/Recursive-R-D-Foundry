name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # No second checkout, no PAT: the evidence kernel is vendored.
      - run: pip install pytest
      - name: tests (internal + ported FEK falsification suite)
        run: make test
      - name: governed cycle
        run: make demo
      - name: overclaim scan (vendored kernel scanning this repo's prose)
        run: make audit
