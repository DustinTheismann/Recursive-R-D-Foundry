[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-rd-foundry"
version = "0.1.0"
description = "Governed successor-selection loop: evidence-gated promotion, refutation supremacy, quarantined failure traits."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "DustinTheismann" }]
# Zero third-party RUNTIME dependencies: the evidence kernel is vendored under
# vendor/fek (see vendor/README.md) so this repo runs cold. PyYAML is optional
# and only needed if YAML registries/source-maps are added (none are here).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src", "vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The vendored kernel resolves `import fek` with no install and no sibling clone.
pythonpath = ["src", "vendor"]
